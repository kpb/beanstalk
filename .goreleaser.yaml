version: 2

project_name: beanstalk

builds:
  - id: beanstalk
    main: ./cmd/beanstalk
    binary: beanstalk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kpb/beanstalk/internal/commands.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: beanstalk
    ids:
      - beanstalk
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

brews:
  - name: beanstalk
    ids:
      - beanstalk
    homepage: https://github.com/kpb/beanstalk
    description: Terminal-native implementation of the Beans task-file format
    license: GPL-3.0-only
    repository:
      owner: kpb
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
